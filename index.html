<style>
  :root { --bg:#1a1a1a; --panel:#212121; --fg:#e8e8e8; --dim:#909090;
          --red:#FF4444; --blue:#5B85FF; --rule:#3a3a3a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:10px 14px; background:var(--bg); color:var(--fg);
         font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
  a { color: inherit; text-decoration: underline dotted; }
  a:hover { text-decoration: underline; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;

  h1 { font-size:15px; font-weight:600; margin:0; }

  button { cursor:pointer; }

  #note p { margin:0 0 10px 0; }

    #note pre { font: 12px/1.4 ui-monospace, Consolas, monospace;
              color: var(--dim); white-space: pre-wrap;

  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(0,1fr); }

<script type="text/plain" id="note-MA">
apex_place: near Dover, Norfolk County
apex_mechanism: georeferencing

The densest cell in Massachusetts is not where one would guess. It sits
in Norfolk County, in the region of the town of Dover and near Wellesley College. 

Clara Cummings collected extensively in this region, but she died in the
early twentieth century. So to the extent her work drives this cell, the
density is not the result of her collecting alone — it is the result of
subsequent geolocation work, of someone much later assigning latitudes and
longitudes to her records. Material of hers that was never georeferenced
does not appear on this map at all.

The summary reveals problems in the data set. Cummings was not collecting in 
1853, that record almost certainly is 1883.
Her name is not uniformly represented (though in the 383 instances has been
regularized by me).

That makes this apex region and count a useful reminder about what these sheets show. A bright
cell records where specimens have been collected, accessioned, databased,
and given coordinates. The last of those steps happened a century after the
first, and it happened unevenly.

Massachusetts also has no unattested cells at this grain — every cell in
the state holds at least one record. That is a statement about an 18.2 km
grid as much as about the collecting, and it sits oddly beside the
widespread belief that the state is picked over and no longer worth
working.

<script type="text/plain" id="note-_intro">
apex_place: how to read a sheet

Each sheet divides a state into hexagonal cells about 18 km across. A cell is
one of two things and never both.

Cyan means the cell holds at least one record, with brightness giving the
number of specimens on a log scale. Plasma — blue through yellow — means the
cell holds no record, with colour giving the distance to the nearest cell that
does.

The two are separate measurements with no conversion between them. The eye
fuses them into a single sense of how well the ground is known, which is a
fair reading, but only as an ordering: the map supports "this is better known
than that" and does not support arithmetic.

The red diamond marks the centre of the largest record-free circle, and the
blue diamond the cell holding the most specimens. Either is omitted where it
would mark a tie rather than a standout.

An empty cell does not mean nobody has collected there. It means no record
meeting the study requirements was produced — the specimen may be
undatabased, held without coordinates, too vaguely localised to place, or
determined only to genus.

Use the selector to choose a state, or the arrow keys to step through all
forty-eight.

</script>

function esc(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function osm(lat, lon, label, cls) {
  const url = 'https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lon
            + '#map=11/' + lat + '/' + lon;
  return '<a class="' + cls + '" href="' + url + '" target="_blank" '
       + 'rel="noopener">' + label + '</a>';
}

/* Notes are plain text: blank lines separate paragraphs, and two optional
   leading fields become a subhead. */
function renderNote(txt, s) {
  const lines = txt.replace(/\r/g,'').split('\n');
  let place = '', mech = '', start = 0;
  for (let k = 0; k < lines.length && k < 6; k++) {
    const m = lines[k].match(/^(apex_place|apex_mechanism):\s*(.*)$/);
    if (m) { if (m[1] === 'apex_place') place = m[2]; else mech = m[2];
             start = k + 1; }
    else if (lines[k].trim() !== '') break;
  }
  const body = lines.slice(start).join('\n').trim();
  let html = '<h2>' + esc(s.n) + '</h2>';
  const bits = [];
  if (place) bits.push(esc(place));
  if (mech)  bits.push(esc(mech));
  if (bits.length) html += '<div class="meta">densest cell: '
                         + bits.join(' &middot; ') + '</div>';
  // html += body.split(/\n\s*\n/).map(p => '<p>' + esc(p.trim()) + '</p>').join('');
    html += body.split(/\n\s*\n/).map(p => {
    const t = p.replace(/\n+$/,'');
    const im = t.trim().match(/^!\[[^\]]*\]\(([^)\s]+)\)$/);
    if (im) return '<a href="' + esc(im[1]) + '" target="_blank">'
                 + '<img src="' + esc(im[1]) + '" alt=""></a>';
    return /\n[ \t]|  |\t/.test(t)
      ? '<pre>' + esc(t) + '</pre>'
      : '<p>' + esc(t.trim()) + '</p>';
  }).join('');
  return html;
}

function show(k, push) {
  i = (k + S.length) % S.length;
  const s = S[i];
  if (push !== false)
    history.replaceState(null, '', '?state=' + s.a);
  sheet.src = 'grand_void_' + s.a + '.png';
  pick.value = i;

  let t = '';
  if (s.mx === null) {
    t = 'no unattested cells at this grain';
  } else {
    t = 'largest void ' + osm(s.elat, s.elon, s.mx.toFixed(1) + ' km', 'red')
      + ' · median ' + s.md.toFixed(1) + ' km'
      + (s.ed === 'TRUE' ? '' : ' · epitome suppressed');
  }
  if (s.ax !== null)
    t += ' · densest cell '
       + osm(s.alat, s.alon, s.ax.toLocaleString() + ' specimens', 'blue');
  stats.innerHTML = t;

  const el = document.getElementById('note-' + s.a);
  if (el) { note.innerHTML = renderNote(el.textContent, s);
            main.classList.remove('solo'); }
  else    { note.innerHTML = ''; main.classList.add('solo'); }
}

function intro() {
  i = -1;
  history.replaceState(null, '', location.pathname);
  sheet.src = 'void_sheet_annotated.png';
  pick.value = '';
  stats.innerHTML = 'how to read a sheet';
  const el = document.getElementById('note-_intro');
    if (el) { note.innerHTML = renderNote(el.textContent, {n: 'How to read a sheet'});
            main.classList.remove('solo'); }
  else    { note.innerHTML = ''; main.classList.add('solo'); }
}

pick.addEventListener('change', e => {
  if (e.target.value === '') intro(); else show(+e.target.value);
});
document.getElementById('prev').addEventListener('click', () => show(i < 0 ? S.length - 1 : i - 1));
document.getElementById('next').addEventListener('click', () => show(i < 0 ? 0 : i + 1));
document.getElementById('zoom').addEventListener('click', e => {
  document.body.classList.toggle('fit');
  e.target.textContent = document.body.classList.contains('fit')
    ? 'full size' : 'fit to window';
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft') show(i < 0 ? S.length - 1 : i - 1); 
  if (e.key === 'ArrowRight') show(i < 0 ? 0 : i + 1);
});

/* Open on the state named in the query string, if there is one. */
const want = new URLSearchParams(location.search).get('state');
const at = want ? S.findIndex(s => s.a === want.toUpperCase()) : -1;
if (at >= 0) show(at, false); else intro();
</script>
</body>
</html>

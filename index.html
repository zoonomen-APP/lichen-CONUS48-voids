<title>Lichen collection voids — state sheets</title>
<style>
  :root { --bg:#1a1a1a; --panel:#212121; --fg:#e8e8e8; --dim:#909090;
          --red:#FF4444; --blue:#5B85FF; --rule:#3a3a3a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:10px 14px; background:var(--bg); color:var(--fg);
         font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
  a { color: inherit; text-decoration: underline dotted; }
  a:hover { text-decoration: underline; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
           margin-bottom:8px; }
  h1 { font-size:15px; font-weight:600; margin:0; }
  select, button { background:#2a2a2a; color:var(--fg); border:1px solid #444;
                   padding:3px 8px; font:inherit; border-radius:3px; }
  button { cursor:pointer; }
  #stats { color:var(--dim); font-variant-numeric:tabular-nums; }
  #stats .red  { color:var(--red); }
  #stats .blue { color:var(--blue); }

  main { display:grid; gap:14px; align-items:start;
         grid-template-columns: minmax(0,1fr) 380px; }
  main.solo { grid-template-columns: minmax(0,1fr); }

  #sheetwrap { min-width:0; }
  img { width:100%; height:auto; display:block; background:#111; }
  body.fit img { width:auto; max-width:100%;
                 max-height: calc(100vh - 120px); margin:0 auto; }

  #note { background:var(--panel); border:1px solid var(--rule);
          border-radius:4px; padding:14px 16px;
          position:sticky; top:10px;
          max-height: calc(100vh - 90px); overflow:auto; }
  main.solo #note { display:none; }
  #note h2 { font-size:14px; margin:0 0 8px 0; }
  #note .meta { color:var(--dim); font-size:12px; margin-bottom:10px;
                border-bottom:1px solid var(--rule); padding-bottom:8px; }
  #note p { margin:0 0 10px 0; }

  footer { color:var(--dim); font-size:12px; margin-top:10px; }

    #note pre { font: 12px/1.4 ui-monospace, Consolas, monospace;
              color: var(--dim); white-space: pre-wrap;
              overflow-x: auto; margin: 0 0 10px 0; }

    #note img { max-width: 100%; height: auto; display: block;
	    margin: 12px 0; border-radius: 3px; }

  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(0,1fr); }
    #note { position:static; max-height:none; }
    body.fit img { max-height:none; }
  }

<script type="text/plain" id="note-CA">
apex_place: Santa Rosa Island, Santa Barbara County
apex_mechanism: two inventories

California's densest cell lies on Santa Rosa Island, in Channel Islands National Park. It holds 2,400 records from 42 collectors. Almost all of them come from two short periods: 1,343 records from the 1990s, nearly all from 1993-1994, and 1,020 from the 2000s. Before 1990 the cell has two dated records.

The first period is an Arizona State University party: Nash, Ryan, Wetmore and Marsh account for 1,234 records, most of them dated 1994. Stephen and Sylvia Sharnoff were on the island the same year, collecting the voucher specimens behind the photographs in Lichens of North America; those are preserved specimens, most of them at the Canadian Museum of Nature, entered under several spellings of the pair's names. The second is the National Park's own lichen inventory, carried out with the UC Riverside herbarium: Knudsen has 890 records, nearly all from 2006-2009, and Kindsvater's 106 from 2003-2004 are at Santa Barbara Botanic Garden.

The taxa read as an inventory with fog-zone coast taxa. No name reaches 2% of the records; the ten most frequent are each taken between 30 and 41 times, and they include Niebla, Vermilacinia, Teloschistes flavicans and Leucodermia leucomelos. The cell is dense; an island is a bounded thing to inventory and a boat trip concentrates the collectors.

<script type="text/plain" id="note-CO">
apex_place: Middle Boulder Creek Canyon, Boulder County, Colorado
apex_mechanism: one collector's day, distributed as duplicates

Colorado's apex cell (its densest hexagon) holds 1,500 records, and most come from one spot: Middle Boulder Creek Canyon, about 1.5 miles northeast of Tungsten in the vicinity of Castle Rock, Boulder County, Colorado, at about 2,410 m, as three specimen labels give it. Sam Shushan collected 601 of the 1,500 (40%), between 1952 and 1987, and the 1960s alone account for 756 records. W. A. Weber, often Shushan's companion in the field in the 1950s, follows with 127; his many name forms were regularized on 2026-10-22, before the block below was drawn.

The mechanism is a single date. 352 records carry Shushan's name and the date 1961-07-03, held by 37 herbaria; 305 of them fall in this cell. They bear his own collector numbers (mostly written "sl-"), 108 distinct, and the numbers are of two kinds: 74 are held by one herbarium only, while eight are held by 15 to 18 herbaria each. Those eight were gathered in quantity and sent out as duplicates. None of the three labels read names a series, so this is not an exsiccata; it is one collector's day of numbered gatherings, some of them distributed widely. Whether every one was collected that day, and how many organisms a number stands for, the records cannot say.

The taxa table should be read with that in mind. Its leading names (Parmelia saxatilis, Nephroma parile, Leptogium saturninum, Peltigera aphthosa, P. collina) are largely the taxa of the most widely distributed numbers; number 172, Parmelia saxatilis, alone has 31 records in 18 herbaria. So the table weights those taxa by what Shushan chose to send out, as well as by what grew there. Each specimen still stands on its own: two of the numbers already carry different names in different herbaria, and Jacob Watts, the cell's fourth collector (2023 to 2024), has redetermined at least one of the 1961 packets at COLO in 2026. The cell also ranks second of 479 CONUS48 hexagons for Umbilicaria hyperborea, with 44 records (only a cell in Coos County, New Hampshire, holds more, 58), and 20 of those 44 are Shushan's from 1961-07-03. The cell's earlier history is smaller: 75 records from the 1890s, 41 of them Arthur E. Morgan's in 1898.

<script type="text/plain" id="note-ID">
apex_place: Priest River Experimental Forest, Bonner County, Idaho
apex_mechanism: one field season (1969), with duplicates

Idaho's apex cell lies in or beside the Priest River Experimental Forest, a Forest Service research forest in Bonner County, Idaho, and it is mostly the record of one summer. Theodore L. Esslinger collected 815 of the cell's 896 records between June and August 1969, on about forty days. One of his labels (WIS-L-0119503) names the forest and gives the forest habitat type, "Tsuga-Pachistima", which suggests an ecological study rather than general collecting.

Most of the records stand on two points a couple of kilometres apart, both given in whole minutes of latitude and longitude, as his labels give them: 408 records on one and 338 on the other. Apart from Esslinger the cell is thin. McCune, Rosentreter, Spribille and others added about 50 records between 1997 and 2004.

Esslinger's 824 records are not 824 collections. They are spread across about twenty herbaria, and counted by date and taxon they come to about 500 gatherings, many of them held two to twelve times as duplicates. The largest shares are in his own herbarium and at the University of Idaho (ID), and those two mostly hold different gatherings. The apex therefore reflects one intensive field season, enlarged by the distribution of its duplicates.

The cell's third most frequent taxon, *Esslingeriana idahoensis*, belongs to a genus named in Esslinger's honour. Its type apparently came not from the cell but from Mount Spokane State Park, Spokane County, Washington, collected by Esslinger in 1970, the year after his Priest River season.

<script type="text/plain" id="note-MA">
apex_place: near Dover, Norfolk County
apex_mechanism: georeferencing

The densest cell in Massachusetts is
in Norfolk County, near Wellesley College. 

Clara Cummings collected extensively in this region for over
20 years, She died in the early twentieth century. 
So while her work predominantly populates this cell, the
result *here* is not from her collecting alone, but from
georeferencing quite recently. 
Paradoxcially the lack of latitude and longitude in
a relatively tightly bounded group of records results
in it being a densely populated set *with* lat. long. values.

<script type="text/plain" id="note-MT">
Montana's densest cell sits just west of Bozeman, 888 records.

The apex results from a master's thesis. Jessie Salix surveyed Lewis and Clark
Caverns State Park for her degree at Montana State, collecting from
twenty-two sites and finding 164 species — almost half on rock, a third on
bark or wood. She holds 793 of the cell's 888 records, all between 2000
and 2011, against 95 for everyone else combined. The park is small enough
to sit inside a single cell at this resolution, so a survey that would be
invisible at a coarser grain becomes the brightest cell in the state.

The taxa are dry-country saxicolous: Physcia caesia, Xanthoparmelia
mexicana, Aspicilia cinerea, Lobothallia alphoplaca. Rock lichens on the
eastern slope, not the forest flora that dominates Montana's western
sheets.

<script>
const pick  = document.getElementById('pick');
const sheet = document.getElementById('sheet');
const stats = document.getElementById('stats');
const note  = document.getElementById('note');
const main  = document.getElementById('main');
let i = 0;
{ const o = document.createElement('option');
  o.value = ''; o.textContent = 'how to read a sheet';
  pick.appendChild(o); }

S.forEach((s, k) => {
  const o = document.createElement('option');
  o.value = k;
  o.textContent = s.a + ' — ' + s.n + (s.note ? ' *' : '');
  pick.appendChild(o);
});

function esc(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function osm(lat, lon, label, cls) {
  const url = 'https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lon
            + '#map=11/' + lat + '/' + lon;
  return '<a class="' + cls + '" href="' + url + '" target="_blank" '
       + 'rel="noopener">' + label + '</a>';
}

/* Notes are plain text: blank lines separate paragraphs, and two optional
   leading fields become a subhead. */
function renderNote(txt, s) {
  const lines = txt.replace(/\r/g,'').split('\n');
  let place = '', mech = '', start = 0;
  for (let k = 0; k < lines.length && k < 6; k++) {
    const m = lines[k].match(/^(apex_place|apex_mechanism):\s*(.*)$/);
    if (m) { if (m[1] === 'apex_place') place = m[2]; else mech = m[2];
             start = k + 1; }
    else if (lines[k].trim() !== '') break;
  }
  const body = lines.slice(start).join('\n').trim();
  let html = '<h2>' + esc(s.n) + '</h2>';
  const bits = [];
  if (place) bits.push(esc(place));
  if (mech)  bits.push(esc(mech));
  if (bits.length) html += '<div class="meta">densest cell: '
                         + bits.join(' &middot; ') + '</div>';
  // html += body.split(/\n\s*\n/).map(p => '<p>' + esc(p.trim()) + '</p>').join('');
    html += body.split(/\n\s*\n/).map(p => {
    const t = p.replace(/\n+$/,'');
    const im = t.trim().match(/^!\[[^\]]*\]\(([^)\s]+)\)$/);
    if (im) return '<a href="' + esc(im[1]) + '" target="_blank">'
                 + '<img src="' + esc(im[1]) + '" alt=""></a>';
    return /\n[ \t]|  |\t/.test(t)
      ? '<pre>' + esc(t) + '</pre>'
      : '<p>' + esc(t.trim()) + '</p>';
  }).join('');
  return html;
}

function show(k, push) {
  i = (k + S.length) % S.length;
  const s = S[i];
  if (push !== false)
    history.replaceState(null, '', '?state=' + s.a);
  sheet.src = 'grand_void_' + s.a + '.png';
  pick.value = i;

  let t = '';
  if (s.mx === null) {
    t = 'no unattested cells at this grain';
  } else {
    t = 'largest void ' + s.mx.toFixed(1) + ' km '
      + osm(s.elat, s.elon, 'map', 'red')
      + ' · median ' + s.md.toFixed(1) + ' km'
      + (s.ed === 'TRUE' ? '' : ' · epitome suppressed');
  }
  if (s.ax !== null)
    t += ' · densest cell ' + s.ax.toLocaleString() + ' records '
       + osm(s.alat, s.alon, 'map', 'blue');
  stats.innerHTML = t;

  const el = document.getElementById('note-' + s.a);
  if (el) { note.innerHTML = renderNote(el.textContent, s);
            main.classList.remove('solo'); }
  else    { note.innerHTML = ''; main.classList.add('solo'); }
}

function intro() {
  i = -1;
  history.replaceState(null, '', location.pathname);
  sheet.src = 'void_sheet_annotated.png';
  pick.value = '';
  stats.innerHTML = 'how to read a sheet';
  const el = document.getElementById('note-_intro');
    if (el) { note.innerHTML = renderNote(el.textContent, {n: 'How to read a sheet'});
            main.classList.remove('solo'); }
  else    { note.innerHTML = ''; main.classList.add('solo'); }
}

pick.addEventListener('change', e => {
  if (e.target.value === '') intro(); else show(+e.target.value);
});
document.getElementById('prev').addEventListener('click', () => show(i < 0 ? S.length - 1 : i - 1));
document.getElementById('next').addEventListener('click', () => show(i < 0 ? 0 : i + 1));
document.getElementById('zoom').addEventListener('click', e => {
  document.body.classList.toggle('fit');
  e.target.textContent = document.body.classList.contains('fit')
    ? 'full size' : 'fit to window';
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft') show(i < 0 ? S.length - 1 : i - 1); 
  if (e.key === 'ArrowRight') show(i < 0 ? 0 : i + 1);
});

/* Open on the state named in the query string, if there is one. */
const want = new URLSearchParams(location.search).get('state');
const at = want ? S.findIndex(s => s.a === want.toUpperCase()) : -1;
if (at >= 0) show(at, false); else intro();
</script>
